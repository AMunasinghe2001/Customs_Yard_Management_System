# ============================================================================
#  63 · Server tuning — sized for 100+ concurrent desktop clients
#
#  ⚠️ This is NOT a .sql file and is not applied by build_schema.py. These are
#  postgresql.conf settings; SQL cannot set them. Apply them by hand, once, on
#  the Yard PC that hosts the database (see "How to apply" at the bottom).
#
#  ── Why this file exists ───────────────────────────────────────────────────
#  The app is a desktop client that talks STRAIGHT to Postgres. There is no
#  middle tier, so there is no shared pool: every PC on the LAN opens its own.
#  The server's connection limit is therefore divided between all of them:
#
#      clients x (PG_POOL_SIZE + 1 listener) <= max_connections - reserved
#
#  The stock server ships with max_connections = 100 and the app used to open
#  9 sockets per PC (pool of 8, plus the LISTEN connection). That is ELEVEN
#  users before the twelfth is refused with:
#
#      53300: sorry, too many connections for role "postgres"
#
#  which looks like a server fault and is only arithmetic. Two changes fix it
#  together, and BOTH are needed:
#
#    * the app now opens 4 sockets per PC, not 9   (PG_POOL_SIZE = 3 + listener)
#    * this file raises max_connections to 400
#
#      400 - 3 reserved = 397 ; 397 / 4 = 99 clients, with headroom for
#      pgAdmin, backups and the odd psql session.
#
#  ── Sizing assumption ──────────────────────────────────────────────────────
#  Written for the current Yard PC: 16 GB RAM, SSD, PostgreSQL 18, dedicated
#  to the database. Re-derive shared_buffers and effective_cache_size if the
#  machine changes — the notes on each line say from what.
# ============================================================================

# ── Connections ─────────────────────────────────────────────────────────────
#  Each connection is a separate BACKEND PROCESS on Windows, costing a few MB
#  of its own plus up to work_mem per sort. 400 idle backends is roughly
#  0.4-1.2 GB before any query runs, which 16 GB absorbs comfortably — but it
#  is why work_mem below is deliberately modest rather than generous.
max_connections = 400
superuser_reserved_connections = 3

# ── Memory ──────────────────────────────────────────────────────────────────
#  shared_buffers: the classic 25% of RAM. The whole database is currently
#  ~4 MB, so in practice every table and index lives in cache and reads never
#  touch the disk at all. The headroom is for growth, not for today.
shared_buffers = 4GB

#  effective_cache_size: NOT an allocation — it only tells the planner how much
#  memory the OS is likely using to cache files, so it prefers index scans over
#  sequential ones. 50-75% of RAM is the usual figure.
effective_cache_size = 12GB

#  work_mem is per SORT, not per connection: one query with three sorts can use
#  three times this, and 400 connections doing that at once is the classic way
#  to exhaust a server. 8MB x a realistic concurrent-sort count stays well
#  inside 16 GB, and the reporting queries that sort most now run against the
#  indexes added in 63_indexes.sql instead of sorting at all.
work_mem = 8MB

#  Only used by VACUUM, CREATE INDEX and ALTER TABLE — a handful of processes,
#  never 400 — so it can be much larger than work_mem.
maintenance_work_mem = 512MB

# ── Planner ─────────────────────────────────────────────────────────────────
#  random_page_cost defaults to 4.0, a number that assumes a spinning disk
#  where seeking costs four times a sequential read. On an SSD it is ~1.1, and
#  leaving it at 4 is the single most common reason a server IGNORES a
#  perfectly good index and sequential-scans instead — which would waste the
#  indexes in 63_indexes.sql.
random_page_cost = 1.1
effective_io_concurrency = 200

# ── Write-ahead log ─────────────────────────────────────────────────────────
#  With 100 clients writing, the default 1GB max_wal_size forces frequent
#  checkpoints, and each one stalls writers. Larger WAL means fewer, and
#  completion_target spreads each checkpoint's flushing over the interval
#  rather than dumping it at once.
wal_buffers = 16MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# ── Parallelism ─────────────────────────────────────────────────────────────
#  Reporting queries scan the whole packages set; these let one use several
#  cores. Kept modest so 100 clients cannot each claim workers at once.
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2

# ── Observability ───────────────────────────────────────────────────────────
#  Without this a slow screen is a guess. Anything over a second is logged
#  with its parameters, so the next "the app is slow" report names a query.
log_min_duration_statement = 1000
log_lock_waits = on
log_checkpoints = on

#  pg_stat_statements ranks queries by TOTAL time across all clients, which is
#  what matters here: a 20ms query run 500 times a minute by 100 PCs costs far
#  more than one 2-second report. Requires a restart to load the library.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# ── Autovacuum ──────────────────────────────────────────────────────────────
#  The hot tables here are small and updated constantly (statuses flipping,
#  deliveries recorded), which is exactly the shape that bloats. The stock
#  threshold of 20% dead rows is too lax for a 200-row table; 5% keeps the
#  planner's statistics honest so it keeps choosing the new indexes.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s

# ============================================================================
#  How to apply  (once, on the database PC — currently C:/pgsql-extract/data)
#
#   1. Stop the service:        net stop postgresql-18
#   2. Append this file's settings to postgresql.conf, or better, keep it
#      separate and add ONE line at the very END of postgresql.conf:
#
#          include 'conf.d/63_server_tuning.conf'
#
#      (copy this file to <data_directory>/conf.d/ first; a later setting wins,
#      so the include must come after the stock block it overrides)
#   3. Start the service:       net start postgresql-18
#   4. Verify — every value below should read as set above:
#
#          select name, setting, unit from pg_settings
#          where name in ('max_connections','shared_buffers','work_mem',
#                         'random_page_cost','effective_cache_size');
#
#   5. Enable the statement statistics view (needs the restart from step 3):
#
#          create extension if not exists pg_stat_statements;
#
#  ⚠️ max_connections and shared_buffers need the RESTART; they cannot be
#  changed with `select pg_reload_conf()`. The rest can.
# ============================================================================
